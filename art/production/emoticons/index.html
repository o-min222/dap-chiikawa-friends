<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아인 표정</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 24px; background: #f4f3f0; color: #393533; font-family: Geist, 'Segoe UI', sans-serif; }
  main { max-width: 1000px; margin: auto; }
  h1 { margin: 0 0 24px; font-size: 24px; font-weight: 600; }
  section { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  figure { margin: 0; padding: 12px 12px 20px; background: #fff; border-radius: 12px; text-align: center; }
  img { display: block; width: 100%; max-width: 224px; aspect-ratio: 1; margin: auto; }
  figcaption { margin-top: 8px; font-size: 15px; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible { outline: 2px solid #786757; outline-offset: 4px; }
</style>
<main>
  <h1>아인 표정</h1>
  <section aria-label="아인 표정 12종">
    <figure><a href="neutral.png"><img src="neutral.png" alt="평온한 아인" width="224" height="224"><figcaption>평온</figcaption></a></figure>
    <figure><a href="happy.png"><img src="happy.png" alt="기뻐하는 아인" width="224" height="224"><figcaption>기쁨</figcaption></a></figure>
    <figure><a href="excited.png"><img src="excited.png" alt="신나는 아인" width="224" height="224"><figcaption>신남</figcaption></a></figure>
    <figure><a href="grateful.png"><img src="grateful.png" alt="고마워하는 아인" width="224" height="224"><figcaption>감사</figcaption></a></figure>
    <figure><a href="confident.png"><img src="confident.png" alt="자신 있는 아인" width="224" height="224"><figcaption>자신감</figcaption></a></figure>
    <figure><a href="thinking.png"><img src="thinking.png" alt="생각하는 아인" width="224" height="224"><figcaption>생각</figcaption></a></figure>
    <figure><a href="curious.png"><img src="curious.png" alt="궁금한 아인" width="224" height="224"><figcaption>궁금함</figcaption></a></figure>
    <figure><a href="surprised.png"><img src="surprised.png" alt="놀란 아인" width="224" height="224"><figcaption>놀람</figcaption></a></figure>
    <figure><a href="confused.png"><img src="confused.png" alt="어리둥절한 아인" width="224" height="224"><figcaption>혼란</figcaption></a></figure>
    <figure><a href="worried.png"><img src="worried.png" alt="걱정하는 아인" width="224" height="224"><figcaption>걱정</figcaption></a></figure>
    <figure><a href="sad.png"><img src="sad.png" alt="슬픈 아인" width="224" height="224"><figcaption>슬픔</figcaption></a></figure>
    <figure><a href="embarrassed.png"><img src="embarrassed.png" alt="쑥스러운 아인" width="224" height="224"><figcaption>쑥스러움</figcaption></a></figure>
  </section>
</main>
</html>
