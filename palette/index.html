<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>치이카와 친구들과 대화</title>
  <link rel="stylesheet" href="style.css">
  <script src="animation.js" defer></script>
  <script src="markdown.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
  <header class="titlebar"><span>치이카와 친구들</span><button id="close" aria-label="창 닫기">×</button></header>
  <div id="tabs" role="tablist" aria-label="친구와 대화">
    <button id="friends-tab" role="tab" aria-selected="true" aria-controls="friends-panel">친구목록</button>
    <button id="chat-tab" role="tab" aria-selected="false" aria-controls="chat-panel">채팅</button>
  </div>
  <section id="friends-panel" role="tabpanel" aria-labelledby="friends-tab"><div id="character-list" aria-label="친구목록"></div></section>
  <div class="layout" id="chat-panel" role="tabpanel" aria-labelledby="chat-tab" hidden>
    <main>
      <header class="conversation-header">
        <canvas id="pet" width="192" height="208" aria-hidden="true"></canvas>
        <div class="identity"><h1 id="character-name">친구들과 대화</h1><p id="activity" role="status">불러오는 중…</p></div>
        <details class="chat-options"><summary aria-label="대화 설정">⋯</summary><div class="chat-options-menu"><button id="summon-chat">불러오기</button><button id="clear" disabled>대화 지우기</button></div></details>
      </header>
      <section id="messages" aria-label="대화 내용" tabindex="0"></section>
      <div id="error-panel" hidden><p id="error" role="alert"></p><button id="retry" class="quiet">다시 시도</button></div>
      <form id="composer">
        <label class="sr-only" for="message">메시지</label>
        <textarea id="message" placeholder="하고 싶은 말을 적어 주세요" maxlength="4000" rows="2" disabled></textarea>
        <button id="send" type="submit" disabled>보내기</button>
      </form>
    </main>
  </div>
</body>
</html>
